name: Simple Audio Cutter

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tools
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg .
          chmod +x ffmpeg
          pip install requests

      - name: Execute Cutting
        shell: python
        run: |
          import os, re, subprocess, requests, json

          BOT_TOKEN = "8661494358:AAFHqOKhwWbNC4-pS24MD9CRCOoaaump3T0"
          payload = json.loads(r'''${{ toJson(github.event.client_payload) }}''')
          
          chat_id = payload['chat_id']
          file_id = payload['file_id']
          times = payload['times']

          # 1. تحميل الملف عبر البوت
          res = requests.get(f"https://api.telegram.org/bot{BOT_TOKEN}/getFile?file_id={file_id}").json()
          if not res.get('ok'):
              exit()
          
          file_path = res['result']['file_path']
          audio_url = f"https://api.telegram.org/file/bot{BOT_TOKEN}/{file_path}"
          
          with open("input.audio", "wb") as f:
              f.write(requests.get(audio_url).content)

          # 2. استخراج التواقيت والقص
          matches = re.findall(r"(\d+[:\d]*)\s*[- ]\s*(\d+[:\d]*)", times)
          
          for i, (s, e) in enumerate(matches):
              def to_sec(t):
                  p = list(map(int, t.split(':')))
                  return p[0]*3600 + p[1]*60 + p[2] if len(p)==3 else p[0]*60 + p[1] if len(p)==2 else p[0]

              start = to_sec(s)
              duration = to_sec(e) - start
              output = f"result_{i}.ogg"

              subprocess.run(["./ffmpeg", "-y", "-ss", str(start), "-t", str(duration), "-i", "input.audio", "-c:a", "libopus", "-b:a", "64k", output])

              # 3. إرسال النتيجة
              if os.path.exists(output):
                  with open(output, "rb") as f:
                      requests.post(f"https://api.telegram.org/bot{BOT_TOKEN}/sendVoice", 
                                    data={"chat_id": chat_id}, 
                                    files={"voice": f})
                  os.remove(output)

          if os.path.exists("input.audio"):
              os.remove("input.audio")
