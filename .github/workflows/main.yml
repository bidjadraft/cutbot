name: Channel-Based Audio Processor

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg .
          chmod +x ffmpeg
          pip install telethon requests

      - name: Process From Channel
        shell: python
        env:
          SESSION: ${{ secrets.SESSION_TELEGRAM }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          import os, re, asyncio, subprocess, requests
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          BOT_TOKEN = "8661494358:AAFHqOKhwWbNC4-pS24MD9CRCOoaaump3T0"
          CHANNEL_ID = -1003679940913

          async def main():
              client = TelegramClient(StringSession(os.getenv("SESSION")), os.getenv("API_ID"), os.getenv("API_HASH"))
              await client.connect()
              
              # 1. جلب آخر رسالة من القناة
              async for message in client.iter_messages(CHANNEL_ID, limit=1):
                  if not message.media or not message.text:
                      print("No media or caption found!")
                      return

                  # 2. استخراج البيانات من الكابشن
                  # نتوقع النص بصيغة: Times: 00:10-00:20 \n UserID: 123456
                  caption = message.text
                  try:
                      target_user_id = int(re.search(r"UserID:\s*(\d+)", caption).group(1))
                      time_data = re.search(r"Times:\s*(.*)", caption).group(1)
                  except:
                      print("Could not parse caption")
                      return

                  # 3. تحميل الملف
                  input_file = await message.download_media()
                  
                  # 4. معالجة القص
                  matches = re.findall(r"(\d+[:\d]*)\s*[- ]\s*(\d+[:\d]*)", time_data)
                  for i, (s, e) in enumerate(matches):
                      def to_sec(t):
                          p = list(map(int, t.split(':')))
                          return p[0]*3600 + p[1]*60 + p[2] if len(p)==3 else p[0]*60 + p[1] if len(p)==2 else p[0]

                      start = to_sec(s)
                      duration = to_sec(e) - start
                      output = f"result_{i}.ogg"
                      
                      subprocess.run(["./ffmpeg", "-y", "-ss", str(start), "-t", str(duration), "-i", input_file, "-c:a", "libopus", "-b:a", "64k", output])
                      
                      # 5. الإرسال لصاحب الـ ID المستخرج
                      if os.path.exists(output):
                          with open(output, 'rb') as f:
                              requests.post(f"https://api.telegram.org/bot{BOT_TOKEN}/sendVoice", 
                                            data={"chat_id": target_user_id}, 
                                            files={"voice": f})
                          os.remove(output)

                  if os.path.exists(input_file):
                      os.remove(input_file)
              
              await client.disconnect()

          asyncio.run(main())
