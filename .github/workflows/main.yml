name: Ultimate Audio Cutter (Fixed)

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Quick Environment Setup
        run: |
          # تحميل النسخة المستقرة من المحرك
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg .
          chmod +x ffmpeg
          pip install requests

      - name: Run Direct FFmpeg Cutter
        shell: python
        run: |
          import os, requests, subprocess

          token = "${{ github.event.client_payload.token }}"
          file_id = "${{ github.event.client_payload.file_id }}"
          chat_id = "${{ github.event.client_payload.chat_id }}"
          start = "${{ github.event.client_payload.start }}"
          end = "${{ github.event.client_payload.end }}"

          # 1. تحميل الملف
          res = requests.get(f"https://api.telegram.org/bot{token}/getFile?file_id={file_id}").json()
          file_path = res['result']['file_path']
          ext = file_path.split('.')[-1]
          input_file = f"in.{ext}"
          output_file = f"out.{ext}"
          
          with open(input_file, "wb") as f:
              f.write(requests.get(f"https://api.telegram.org/file/bot{token}/{file_path}").content)

          # 2. القص الاحترافي عبر FFmpeg مباشرة
          # استخدمنا -map_metadata لضمان نقل بيانات الملف وتجنب أخطاء التنسيق
          cmd = [
              "./ffmpeg", "-y", 
              "-ss", start, 
              "-to", end, 
              "-i", input_file, 
              "-c", "copy", # محاولة القص الفوري بدون إعادة تشفير
              output_file
          ]
          
          # محاولة أولى: قص سريع بدون إعادة تشفير
          result = subprocess.run(cmd, capture_output=True)
          
          if result.returncode != 0:
              # محاولة ثانية: إعادة تشفير كاملة إذا فشل القص السريع (للملفات المعقدة)
              cmd_reencode = [
                  "./ffmpeg", "-y", 
                  "-ss", start, 
                  "-to", end, 
                  "-i", input_file, 
                  "-preset", "ultrafast",
                  output_file
              ]
              subprocess.run(cmd_reencode, check=True)

          # 3. إرسال النتيجة
          with open(output_file, 'rb') as f:
              requests.post(f"https://api.telegram.org/bot{token}/sendAudio", 
                            data={'chat_id': chat_id}, files={'audio': f})
