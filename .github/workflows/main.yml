name: Python Fast Cut

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Requirements
        run: pip install pydub requests

      - name: Run Cutter
        shell: python
        run: |
          import os, requests
          from pydub import AudioSegment

          # هنا تكمن السرعة: الإشارة للملف الموجود في الـ Root مباشرة
          # سنفترض أنك رفعت ملف 'sox' لمستودعك
          AudioSegment.converter = os.path.abspath("sox") 

          token = "${{ github.event.client_payload.token }}"
          file_id = "${{ github.event.client_payload.file_id }}"
          chat_id = "${{ github.event.client_payload.chat_id }}"
          start = "${{ github.event.client_payload.start }}"
          end = "${{ github.event.client_payload.end }}"

          # جلب وتحميل
          resp = requests.get(f"https://api.telegram.org/bot{token}/getFile?file_id={file_id}").json()
          path = resp['result']['file_path']
          ext = path.split('.')[-1]
          
          with open(f"in.{ext}", "wb") as f:
              f.write(requests.get(f"https://api.telegram.org/file/bot{token}/{path}").content)

          # تحويل الوقت لـ ميللي ثانية
          def to_ms(t):
              p = list(map(int, t.split(':')))
              return (p[0]*3600 + p[1]*60 + p[2])*1000 if len(p)==3 else (p[0]*60 + p[1])*1000

          # القص والإرسال
          audio = AudioSegment.from_file(f"in.{ext}")
          audio[to_ms(start):to_ms(end)].export(f"out.{ext}", format=ext)

          with open(f"out.{ext}", 'rb') as f:
              requests.post(f"https://api.telegram.org/bot{token}/sendAudio", 
                            data={'chat_id': chat_id}, files={'audio': f})
