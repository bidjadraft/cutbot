name: Ultra Light Audio Cutter

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Install Libav (avconv)
        run: |
          sudo apt-get update
          sudo apt-get install -y libav-tools jq bc

      - name: Process Audio
        run: |
          TOKEN="${{ github.event.client_payload.token }}"
          FILE_ID="${{ github.event.client_payload.file_id }}"
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          START="${{ github.event.client_payload.start }}"
          END="${{ github.event.client_payload.end }}"

          # 1. جلب مسار الملف
          FILE_PATH=$(curl -s "https://api.telegram.org/bot$TOKEN/getFile?file_id=$FILE_ID" | jq -r .result.file_path)
          EXT="${FILE_PATH##*.}"
          
          # 2. تحميل الملف
          curl -L -o "in.$EXT" "https://api.telegram.org/file/bot$TOKEN/$FILE_PATH"
          
          # 3. القص باستخدام avconv (أداة خفيفة وشاملة)
          # خيار -c copy يضمن السرعة اللحظية وعدم فقدان الجودة
          avconv -i "in.$EXT" -ss "$START" -to "$END" -c copy "out.$EXT"

          # 4. الإرسال
          curl -F chat_id="$CHAT_ID" \
               -F audio="@out.$EXT" \
               -F caption="✅ تم القص بواسطة avconv الخفيفة" \
               "https://api.telegram.org/bot$TOKEN/sendAudio"
