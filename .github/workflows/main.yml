name: Telethon Audio Cutter Backend

on:
  workflow_dispatch:
    inputs:
      chat_id:
        required: true
      message_id:
        required: true
      steps:
        required: true

jobs:
  silent_process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install telethon requests

      - name: Run Telethon Background Cutter
        env:
          API_ID: 24629594
          API_HASH: "a79fa760e65af09a85eb2cc97cb2263c"
          BOT_TOKEN: "8853762125:AAEJeYtDufaLoQcq8ZbuHpuQ3R42WYJkBXo"
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}
          STEPS: ${{ github.event.inputs.steps }}
        shell: python
        run: |
          import os
          import json
          import asyncio
          import subprocess
          from telethon import TelegramClient
          from telethon.tl.types import DocumentAttributeAudio

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = int(os.environ["CHAT_ID"])
          MESSAGE_ID = int(os.environ["MESSAGE_ID"])
          STEPS = json.loads(os.environ["STEPS"])

          def time_to_sec(t_str):
              if not t_str or not t_str.strip():
                  return -1
              try:
                  parts = [int(p) for p in t_str.strip().split(':') if p.strip()]
                  if len(parts) == 2:
                      return parts[0] * 60 + parts[1]
                  elif len(parts) == 3:
                      return parts[0] * 3600 + parts[1] * 60 + parts[2]
              except Exception:
                  return -1
              return -1

          async def main():
              client = TelegramClient('backend_session', API_ID, API_HASH)
              await client.start(bot_token=BOT_TOKEN)
              
              msg = await client.get_messages(CHAT_ID, ids=MESSAGE_ID)
              if not msg or not msg.media:
                  print("Target message or media not found.")
                  await client.disconnect()
                  return

              input_file = f"download_{CHAT_ID}.mp3"
              print("Downloading media via Telethon...")
              await client.download_media(msg, input_file)

              for idx, step in enumerate(STEPS):
                  start_str = step.get("start", "")
                  end_str = step.get("end", "")
                  
                  start_sec = time_to_sec(start_str)
                  end_sec = time_to_sec(end_str)
                  
                  # تجاوز السطر إذا كان يحتوي على قيم فارغة أو غير صحيحة
                  if start_sec == -1 or end_sec == -1:
                      print(f"Skipping invalid or empty time format at step {idx+1}")
                      continue
                      
                  duration = end_sec - start_sec
                  if duration <= 0:
                      print(f"Skipping step {idx+1}: duration is 0 or negative")
                      continue
                      
                  out_file = f"cut_{CHAT_ID}_{idx}_{start_str.replace(':', '_')}.oga"
                  
                  cmd = [
                      "ffmpeg", "-y", "-ss", str(start_sec), "-t", str(duration),
                      "-i", input_file, 
                      "-c:a", "libopus", 
                      "-b:a", "32k", 
                      "-ar", "48000", 
                      "-ac", "1", 
                      out_file
                  ]
                  subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  
                  if os.path.exists(out_file):
                      try:
                          print(f"Uploading part {idx+1}...")
                          await client.send_file(
                              CHAT_ID, 
                              out_file, 
                              voice=True, 
                              caption="", 
                              attributes=[DocumentAttributeAudio(duration=int(duration), voice=True, title="", performer="")]
                          )
                          print(f"Part {idx+1} uploaded successfully.")
                          await asyncio.sleep(5)
                      except Exception as e:
                          print(f"Error uploading part {idx+1}: {e}")
                      finally:
                          if os.path.exists(out_file):
                              os.remove(out_file)
                      
              if os.path.exists(input_file):
                  os.remove(input_file)
                  
              await client.disconnect()

          asyncio.run(main())
