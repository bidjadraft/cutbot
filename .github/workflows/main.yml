      - name: Execute Download and Cut
        shell: python
        env:
          SESSION: ${{ secrets.SESSION_TELEGRAM }}
          API_ID: 24629594
          API_HASH: a79fa760e65af09a85eb2cc97cb2263c
        run: |
          import os, re, asyncio, subprocess, requests
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          chat_id = int("${{ github.event.client_payload.chat_id }}")
          file_id = "${{ github.event.client_payload.file_id }}"
          time_data = r"""${{ github.event.client_payload.start }}"""
          bot_token = "8661494358:AAFHqOKhwWbNC4-pS24MD9CRCOoaaump3T0"
          channel_id = -1003679940913

          async def main():
              client = TelegramClient(StringSession(os.getenv("SESSION")), os.getenv("API_ID"), os.getenv("API_HASH"))
              await client.connect()
              
              input_file = None
              
              # التعديل: البحث عن أحدث رسالة تحتوي على ميديا فقط (Limit=1)
              if file_id == "large_file":
                  async for message in client.iter_messages(channel_id, limit=1):
                      if message.media:
                          input_file = await message.download_media()
                          break
              else:
                  # البحث في محادثة المستخدم عن آخر ملف أرسله
                  async for message in client.iter_messages(chat_id, limit=5):
                      if message.media:
                          input_file = await message.download_media()
                          break

              if not input_file:
                  return

              matches = re.findall(r"(\d+:?\d*:?\d*)\s*[- ]\s*(\d+:?\d*:?\d*)", time_data)
              for i, (s, e) in enumerate(matches):
                  def to_sec(t):
                      p = list(map(int, t.split(':')))
                      return p[0]*3600 + p[1]*60 + p[2] if len(p)==3 else p[0]*60 + p[1] if len(p)==2 else p[0]

                  start = to_sec(s)
                  dur = to_sec(e) - start
                  output = f"result_{i}.ogg"
                  
                  subprocess.run(["./ffmpeg", "-y", "-ss", str(start), "-t", str(dur), "-i", input_file, "-c:a", "libopus", "-b:a", "64k", "-ar", "48000", "-ac", "1", output])
                  
                  with open(output, 'rb') as f:
                      requests.post(f"https://api.telegram.org/bot{bot_token}/sendVoice", data={"chat_id": chat_id}, files={"voice": f})
              
              await client.disconnect()

          asyncio.run(main())
