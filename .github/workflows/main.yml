name: Ultra Fast Hybrid Cutter

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Quick Install
        run: |
          # تثبيت مباشر بدون تحديث المستودعات لتوفير الوقت
          sudo apt-get install -y sox libsox-fmt-all opus-tools bc

      - name: Smart Process
        run: |
          TOKEN="${{ github.event.client_payload.token }}"
          FILE_ID="${{ github.event.client_payload.file_id }}"
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          START="${{ github.event.client_payload.start }}"
          END="${{ github.event.client_payload.end }}"

          # 1. جلب بيانات الملف
          FILE_INFO=$(curl -s "https://api.telegram.org/bot$TOKEN/getFile?file_id=$FILE_ID")
          FILE_PATH=$(echo $FILE_INFO | jq -r .result.file_path)
          EXT="${FILE_PATH##*.}"
          curl -sL -o "in.$EXT" "https://api.telegram.org/file/bot$TOKEN/$FILE_PATH"

          # 2. حساب الثواني والمدة
          S_SEC=$(echo $START | awk -F: '{ if (NF==3) print ($1*3600)+($2*60)+$3; else if (NF==2) print ($1*60)+$2; else print $1 }')
          E_SEC=$(echo $END | awk -F: '{ if (NF==3) print ($1*3600)+($2*60)+$3; else if (NF==2) print ($1*60)+$2; else print $1 }')
          DURATION=$(echo "$E_SEC - $S_SEC" | bc)

          # 3. محاولة القص بـ SoX أولاً ثم Opus-Tools كبديل
          SUCCESS=false
          if sox "in.$EXT" "out.$EXT" trim $S_SEC $DURATION 2>/dev/null; then
             SUCCESS=true
          elif [[ "$EXT" == "opus" || "$EXT" == "ogg" ]]; then
             opusdec "in.$EXT" --force-wav - 2>/dev/null | sox -t wav - "out.$EXT" trim $S_SEC $DURATION 2>/dev/null && SUCCESS=true
          fi

          # 4. الإرسال
          if [ "$SUCCESS" = true ]; then
             curl -s -F chat_id="$CHAT_ID" -F audio="@out.$EXT" "https://api.telegram.org/bot$TOKEN/sendAudio"
          else
             curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" -d "chat_id=$CHAT_ID&text=❌ فشل القص"
          fi
