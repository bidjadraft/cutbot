name: Ultimate Pro Voice Cutter

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg .
          chmod +x ffmpeg
          pip install requests telethon

      - name: Run Smart Logic
        shell: python
        env:
          SESSION_TELEGRAM: ${{ secrets.SESSION_TELEGRAM }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          import os, requests, subprocess, re, asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          token = "${{ github.event.client_payload.token }}"
          file_id = "${{ github.event.client_payload.file_id }}"
          chat_id = int("${{ github.event.client_payload.chat_id }}")
          time_data = r"""${{ github.event.client_payload.start }}"""

          async def main():
              input_file = None
              
              # 1. محاولة التحميل عبر البوت (للملفات الصغيرة)
              res = requests.get(f"https://api.telegram.org/bot{token}/getFile?file_id={file_id}").json()
              
              if res.get('ok'):
                  print("Downloading via Bot API...")
                  file_path = res['result']['file_path']
                  ext = file_path.split('.')[-1]
                  input_file = f"in.{ext}"
                  with open(input_file, "wb") as f:
                      f.write(requests.get(f"https://api.telegram.org/file/bot{token}/{file_path}").content)
              else:
                  # 2. التحميل بالحساب الشخصي (للملفات الكبيرة > 20MB)
                  print("File too large for Bot. Using User Session...")
                  async with TelegramClient(StringSession(os.getenv("SESSION_TELEGRAM")), os.getenv("API_ID"), os.getenv("API_HASH")) as client:
                      downloaded_path = await client.download_media(file_id)
                      if downloaded_path:
                          input_file = downloaded_path
                          print(f"File downloaded successfully: {input_file}")
                      else:
                          print("Failed to download media via User Session.")
                          return

              if not input_file or not os.path.exists(input_file):
                  print("Error: Input file was not created.")
                  return

              # 3. تحليل المواقيت وقص المقاطع
              time_pairs = re.findall(r"(\d+:?\d*:?\d*)\s*[- ]\s*(\d+:?\d*:?\d*)", time_data)

              async with TelegramClient(StringSession(os.getenv("SESSION_TELEGRAM")), os.getenv("API_ID"), os.getenv("API_HASH")) as client:
                  for i, (start_str, end_str) in enumerate(time_pairs):
                      try:
                          def get_sec(t):
                              p = list(map(int, t.split(':')))
                              if len(p) == 3: return p[0]*3600 + p[1]*60 + p[2]
                              if len(p) == 2: return p[0]*60 + p[1]
                              return p[0]

                          start_sec, end_sec = get_sec(start_str), get_sec(end_str)
                          duration = end_sec - start_sec
                          if duration <= 0: continue

                          output_file = f"voice_{i}.ogg"
                          subprocess.run([
                              "./ffmpeg", "-y", "-ss", str(start_sec), "-t", str(duration),
                              "-i", input_file, "-c:a", "libopus", "-b:a", "64k",
                              "-ar", "48000", "-ac", "1", output_file
                          ], check=True)

                          # إرسال المقطع كبصمة صوتية عبر الحساب الشخصي
                          await client.send_file(chat_id, output_file, voice_note=True)
                          
                      except Exception as e:
                          print(f"Error processing segment {i}: {e}")

          if __name__ == "__main__":
              asyncio.run(main())
