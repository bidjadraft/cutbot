name: Hybrid Audio Processor

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tools
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg .
          chmod +x ffmpeg
          pip install telethon

      - name: Execute Download and Cut
        shell: python
        env:
          SESSION: ${{ secrets.SESSION_TELEGRAM }}
          API_ID: 24629594
          API_HASH: a79fa760e65af09a85eb2cc97cb2263c
        run: |
          import os, re, asyncio, subprocess
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          chat_id = int("${{ github.event.client_payload.chat_id }}")
          file_id = "${{ github.event.client_payload.file_id }}"
          time_data = r"""${{ github.event.client_payload.start }}"""
          channel_id = -1003679940913

          async def main():
              client = TelegramClient(StringSession(os.getenv("SESSION")), os.getenv("API_ID"), os.getenv("API_HASH"))
              await client.connect()
              
              input_file = None
              
              # المنطق الصحيح للبحث عن الملف
              if file_id == "large_file":
                  print(f"Searching in channel: {channel_id}")
                  async for message in client.iter_messages(channel_id, limit=10):
                      if message.media:
                          input_file = await message.download_media()
                          break
              else:
                  print(f"Searching in chat: {chat_id}")
                  async for message in client.iter_messages(chat_id, limit=20):
                      if message.media:
                          input_file = await message.download_media()
                          break

              if not input_file:
                  print("❌ Error: Could not find any audio file.")
                  return

              matches = re.findall(r"(\d+:?\d*:?\d*)\s*[- ]\s*(\d+:?\d*:?\d*)", time_data)
              for i, (s, e) in enumerate(matches):
                  def to_sec(t):
                      p = list(map(int, t.split(':')))
                      if len(p) == 3: return p[0]*3600 + p[1]*60 + p[2]
                      if len(p) == 2: return p[0]*60 + p[1]
                      return p[0]

                  start = to_sec(s)
                  dur = to_sec(e) - start
                  output = f"result_{i}.ogg"
                  
                  subprocess.run([
                      "./ffmpeg", "-y", "-ss", str(start), "-t", str(dur),
                      "-i", input_file, "-c:a", "libopus", "-b:a", "64k",
                      "-ar", "48000", "-ac", "1", output
                  ])
                  
                  await client.send_file(chat_id, output, voice_note=True)
                  print(f"Segment {i} sent successfully.")
              
              await client.disconnect()

          asyncio.run(main())
