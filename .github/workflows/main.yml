name: Hybrid Audio Processor

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg .
          chmod +x ffmpeg
          pip install telethon requests

      - name: Hybrid Execute
        shell: python
        env:
          SESSION: ${{ secrets.SESSION_TELEGRAM }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          import os, re, asyncio, subprocess, requests
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          BOT_TOKEN = "8661494358:AAFHqOKhwWbNC4-pS24MD9CRCOoaaump3T0"
          CHANNEL_ID = -1003679940913
          
          C_PAYLOAD = ${{ toJson(github.event.client_payload) }}
          CHAT_ID = int(C_PAYLOAD['chat_id'])
          FILE_ID = C_PAYLOAD['file_id']
          TIMES = C_PAYLOAD['times']
          IS_LARGE_INPUT = C_PAYLOAD['is_large']

          async def main():
              client = TelegramClient(StringSession(os.getenv("SESSION")), os.getenv("API_ID"), os.getenv("API_HASH"))
              await client.connect()
              
              input_file = "input_audio"
              
              # 1. جلب الملف المصدر
              if IS_LARGE_INPUT:
                  async for msg in client.iter_messages(CHANNEL_ID, limit=1):
                      input_file = await msg.download_media()
                      # حفظ معرف الرسالة لحذفها لاحقاً
                      msg_to_delete = msg.id
              else:
                  # تحميل عبر Bot API (صغير)
                  file_info = requests.get(f"https://api.telegram.org/bot{BOT_TOKEN}/getFile?file_id={FILE_ID}").json()
                  file_path = file_info['result']['file_path']
                  with open(input_file, 'wb') as f:
                      f.write(requests.get(f"https://api.telegram.org/file/bot{BOT_TOKEN}/{file_path}").content)

              # 2. القص
              matches = re.findall(r"(\d+[:\d]*)\s*[- ]\s*(\d+[:\d]*)", TIMES)
              for i, (s, e) in enumerate(matches):
                  def to_sec(t):
                      p = list(map(int, t.split(':')))
                      return p[0]*3600+p[1]*60+p[2] if len(p)==3 else p[0]*60+p[1] if len(p)==2 else p[0]
                  
                  start, duration = to_sec(s), to_sec(e) - to_sec(s)
                  output = f"cut_{i}.ogg"
                  subprocess.run(["./ffmpeg", "-y", "-ss", str(start), "-t", str(duration), "-i", input_file, "-c:a", "libopus", "-b:a", "64k", output])
                  
                  if os.path.exists(output):
                      out_size = os.path.getsize(output)
                      if out_size <= 20 * 1024 * 1024:
                          # إرسال مباشر بالبوت
                          with open(output, 'rb') as f:
                              requests.post(f"https://api.telegram.org/bot{BOT_TOKEN}/sendVoice", data={"chat_id": CHAT_ID}, files={"voice": f})
                      else:
                          # إرسال عبر Telethon للقناة ثم توجيه
                          sent_msg = await client.send_file(CHANNEL_ID, output, voice=True)
                          requests.post(f"https://api.telegram.org/bot{BOT_TOKEN}/forwardMessage", data={"chat_id": CHAT_ID, "from_chat_id": CHANNEL_ID, "message_id": sent_msg.id})
                      os.remove(output)

              # 3. تنظيف القناة (حذف كل الرسائل)
              async for msg in client.iter_messages(CHANNEL_ID):
                  await msg.delete()
              
              if os.path.exists(input_file): os.remove(input_file)
              await client.disconnect()

          asyncio.run(main())
