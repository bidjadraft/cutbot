name: Super Light Fast Cut

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Quick Setup
        run: |
          # تحميل نسخة Static واحدة تعمل مباشرة بدون تثبيت
          wget https://github.com/eugeneware/ffmpeg-static/releases/latest/download/linux-x64 -O ffmpeg
          chmod +x ffmpeg

      - name: Process Audio
        run: |
          TOKEN="${{ github.event.client_payload.token }}"
          FILE_ID="${{ github.event.client_payload.file_id }}"
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          START="${{ github.event.client_payload.start }}"
          END="${{ github.event.client_payload.end }}"

          # 1. جلب رابط الملف
          FILE_PATH=$(curl -s "https://api.telegram.org/bot$TOKEN/getFile?file_id=$FILE_ID" | jq -r .result.file_path)
          EXT="${FILE_PATH##*.}"
          
          # 2. تحميل الملف
          curl -L -o "in.$EXT" "https://api.telegram.org/file/bot$TOKEN/$FILE_PATH"
          
          # 3. القص السريع (Stream Copy)
          ./ffmpeg -i "in.$EXT" -ss "$START" -to "$END" -c copy "out.$EXT"

          # 4. الإرسال
          curl -F chat_id="$CHAT_ID" \
               -F audio="@out.$EXT" \
               -F caption="✅ تم القص بنجاح" \
               "https://api.telegram.org/bot$TOKEN/sendAudio"
