name: Super Light Fast Cut

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Quick Setup
        run: |
          # تحميل نسخة Static مصغرة جداً (تؤدي غرض القص فقط)
          wget https://github.com/eugeneware/ffmpeg-static/releases/latest/download/linux-x64 -O ffmpeg
          chmod +x ffmpeg
          sudo apt-get install -y jq  # مثبت مسبقاً عادة لكن للضمان

      - name: Process Audio
        run: |
          TOKEN="${{ github.event.client_payload.token }}"
          FILE_ID="${{ github.event.client_payload.file_id }}"
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          START="${{ github.event.client_payload.start }}"
          END="${{ github.event.client_payload.end }}"

          # 1. جلب رابط الملف بسرعة
          FILE_PATH=$(curl -s "https://api.telegram.org/bot$TOKEN/getFile?file_id=$FILE_ID" | jq -r .result.file_path)
          EXT="${FILE_PATH##*.}"
          
          # 2. تحميل الملف
          curl -L -o "in.$EXT" "https://api.telegram.org/file/bot$TOKEN/$FILE_PATH"
          
          # 3. القص المباشر (Stream Copy) - أسرع عملية ممكنة برمجياً
          # خيار -c copy يجعل الأداة تقص البايتات فقط دون معالجة الصوت
          ./ffmpeg -i "in.$EXT" -ss "$START" -to "$END" -c copy "out.$EXT"

          # 4. الإرسال الفوري
          curl -F chat_id="$CHAT_ID" \
               -F audio="@out.$EXT" \
               -F caption="✅ تم القص بسرعة فائقة" \
               "https://api.telegram.org/bot$TOKEN/sendAudio"name: Fast Pydub (No Install)

on:
  repository_dispatch:
    types: [cut_audio]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Pydub
        run: pip install pydub requests

      - name: Download Static FFmpeg (Fast)
        run: |
          # تحميل نسخة ثابتة صغيرة جداً لا تحتاج تثبيت
          wget https://johnvansickle.com/ffmpeg/builds/ffmpeg-git-amd64-static.tar.xz
          tar xvf ffmpeg-git-amd64-static.tar.xz
          # نقل المحرك للمسار الحالي ليراه بايثون فوراً
          mv ffmpeg-git-*-amd64-static/ffmpeg .
          mv ffmpeg-git-*-amd64-static/ffprobe .
          chmod +x ffmpeg ffprobe

      - name: Run Python Cutter
        shell: python
        run: |
          import os
          import requests
          from pydub import AudioSegment

          # تعريف مسار ffmpeg محلياً (بدون تثبيت في النظام)
          AudioSegment.converter = os.path.abspath("ffmpeg")
          AudioSegment.ffprobe   = os.path.abspath("ffprobe")

          token = "${{ github.event.client_payload.token }}"
          file_id = "${{ github.event.client_payload.file_id }}"
          chat_id = "${{ github.event.client_payload.chat_id }}"
          start_time = "${{ github.event.client_payload.start }}"
          end_time = "${{ github.event.client_payload.end }}"

          # جلب الملف
          file_info = requests.get(f"https://api.telegram.org/bot{token}/getFile?file_id={file_id}").json()
          file_path = file_info['result']['file_path']
          ext = file_path.split('.')[-1]
          
          with open(f"in.{ext}", "wb") as f:
              f.write(requests.get(f"https://api.telegram.org/file/bot{token}/{file_path}").content)

          def to_ms(t):
              p = list(map(int, t.split(':')))
              return (p[0]*3600 + p[1]*60 + p[2])*1000 if len(p)==3 else (p[0]*60 + p[1])*1000

          # القص
          audio = AudioSegment.from_file(f"in.{ext}")
          audio[to_ms(start_time):to_ms(end_time)].export(f"out.{ext}", format=ext)

          # الإرسال
          with open(f"out.{ext}", 'rb') as f:
              requests.post(f"https://api.telegram.org/bot{token}/sendAudio", 
                            data={'chat_id': chat_id, 'caption': '🚀 قص سريع (بدون تثبيت نظام)'}, 
                            files={'audio': f})
